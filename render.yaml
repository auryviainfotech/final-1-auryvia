# Render Blueprint – use npm (project has package-lock.json)
# https://docs.render.com/blueprint-spec
services:
  - type: web
    name: final-auryvia
    runtime: node
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    # Required env vars in Render Dashboard → Environment:
    # MONGO_URI (MongoDB Atlas connection string – allow 0.0.0.0/0 in Atlas Network Access)
    # Optional: EMAIL_USER, EMAIL_PASSWORD, ADMIN_PASS
